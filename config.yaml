# config.yaml — declarative pipeline configuration.
#
# Everything a deployment needs to change lives here, NOT in code. To point the
# pipeline at a client's warehouse you edit this file (or override via env vars),
# never the Python. Secrets never live here — they come from environment
# variables (see `secrets_env` keys below), which is what a real deployment
# injects from a vault / CI secret store.

# Active profile. Override with APP_ENV=prod. Values under `profiles.<APP_ENV>`
# are deep-merged over `defaults`.
default_profile: dev

defaults:
  pipeline:
    name: local_sales
    dataset: sales
    table: orders
    # full | incremental  (incremental uses the merge + cursor path)
    load_strategy: full

  source:
    type: csv                      # csv | sql_database | rest_api
    path: data/sample.csv
    # For incremental sources:
    cursor_field: updated_at
    primary_key: order_id

  destination:
    type: duckdb                   # duckdb | postgres | bigquery | filesystem
    # duckdb-specific:
    duckdb_path: output/local_sales.duckdb
    # postgres/bigquery read credentials from env (see secrets_env).

  quality:
    enabled: true
    fail_on_error: true            # abort the load if a check fails
    checks:
      required_columns: true
      no_nulls: true
      unique_primary_key: true
      positive_amounts: true
      dates_parse: true

  runtime:
    log_level: INFO                # DEBUG | INFO | WARNING | ERROR
    log_format: text               # text | json
    max_load_retries: 3
    retry_backoff_seconds: 2

  # Names of environment variables that hold secrets for this profile.
  # The loader reads these from os.environ; it never stores the values in YAML.
  secrets_env:
    postgres_dsn: PIPELINE__POSTGRES_DSN
    bigquery_credentials: PIPELINE__BIGQUERY_CREDENTIALS_JSON

profiles:
  dev:
    runtime:
      log_level: DEBUG

  prod:
    # A production deployment typically overrides destination + strategy here.
    pipeline:
      load_strategy: incremental
    destination:
      type: duckdb                 # swap to postgres/bigquery for a real client
    runtime:
      log_level: INFO
      log_format: json
