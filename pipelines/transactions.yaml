# MySQL `transactions` table -> silver Delta. Incremental + upsert + custom transform.
kind: ingest
name: transactions
source:
  type: mysql             # real: mysql+pymysql://... ; demo: sqlite stand-in
  dsn_env: SALES_DSN
  table: transactions
extract:
  incremental_cursor: updated_at
  lag_seconds: 86400        # re-read 1 day behind the watermark (late data)
target:
  table: transactions
  primary_key: txn_id
  write_mode: merge
transforms:
  - normalize_columns
  - derive_line_totals    # <- example table-specific business logic
  - add_ingested_at
money_columns: [amount]     # stored as exact decimal(18,2), not float
quality:
  not_null: [txn_id, updated_at]
  positive: [amount, quantity]
  on_fail: quarantine       # route bad rows to transactions__rejects, load the good ones
